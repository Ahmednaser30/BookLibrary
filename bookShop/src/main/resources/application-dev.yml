spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:book_library}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:bookshop}
    password: ${DB_PASSWORD:bookshop}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:bookshop}
    password: ${MAIL_PASSWORD:bookshop}
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enabled: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

application:
  security:
    mailing:
      frontend:
        activation-url: "http://localhost:4200/activate-account"
  file:
    upload:
      photo-output-path: ./uploads


logging:
  level:
    org:
      hibernate:
        SQL: debug
