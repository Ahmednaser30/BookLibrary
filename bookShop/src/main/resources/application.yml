spring:
  application:
    name: bookShop
  profiles:
    active: dev
  # Local overrides from a .env file (see .env.example), whether started from the repo root or bookShop/
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB



springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: swagger-ui.html


server:
  servlet:
    context-path: /api/v1

application:
  mail:
    from: ${MAIL_FROM:no-reply@booklibrary.local}
  security:
    jwt:
      # Base64 HMAC-SHA256 key; when empty a random key is generated at startup
      secret-key: ${JWT_SECRET:}
      # Token lifetime in milliseconds
      expiration: ${JWT_EXPIRATION:864000}
