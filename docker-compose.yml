services:
  mysql:
    image: mysql:8.4
    container_name: booklibrary-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-book_library}
      MYSQL_USER: ${DB_USERNAME:-bookshop}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bookshop}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mail-dev:
    container_name: booklibrary-maildev
    image: maildev/maildev:2.1.0
    ports:
      - "1080:1080"
      - "1025:1025"

volumes:
  mysql_data:
